name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234 or v2.5.0)'
        required: true
      image_digest:
        description: 'Image SHA-256 digest (optional, recommended)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, production]
        default: staging
      source_sha:
        description: 'Source commit SHA that triggered this deploy'
        required: false
        default: ''
      source_run_id:
        description: 'CI run id that triggered this deploy'
        required: false
        default: ''
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  KUBE_NAMESPACE: wiki-${{ inputs.environment }}
  IMAGE_NAME: ghcr.io/rollwar/wiki
  # Явные URL для проверок (bastion → ingressgateway → wiki service)
  WIKI_URL: ${{ inputs.environment == 'production' && 'http://wiki.k8s-3.sa' || 'http://wiki-stage.k8s-3.sa' }}

jobs:
  # ── Stage 1: deploy new version as GREEN ────────────────────────────────
  deploy-green:
    name: Deploy GREEN (${{ inputs.environment }})
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      green-deployment: ${{ steps.deploy-green.outputs.name }}
      green-revision: ${{ steps.deploy-green.outputs.revision }}
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Verify kubectl + context k8s
        run: |
          kubectl --context k8s version --client
          kubectl --context k8s cluster-info
          kubectl --context k8s get ns ${{ env.KUBE_NAMESPACE }} || {
            echo "::error::Namespace ${{ env.KUBE_NAMESPACE }} not found on context k8s"
            exit 1
          }

      - name: Ensure namespace + base manifests
        run: |
          kubectl --context k8s apply -f deploy/k8s/namespace.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/configmap.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/pvc.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/secret.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/postgres.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/service.yaml
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f deploy/k8s/service-preview.yaml
          # Istio Gateway + VirtualService + DestinationRule
          kubectl --context k8s apply -f deploy/istio/wiki-${{ inputs.environment == 'production' && 'prod' || 'stage' }}.yaml

      - name: Deploy GREEN (new version)
        id: deploy-green
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.image_digest && format('{0}', inputs.image_digest) || inputs.image_tag }}
        run: |
          # Render green manifest with the new image
          sed -e "s|__IMAGE__|${IMAGE_REF}|g" \
              -e "s|__SLOT__|green|g" \
              deploy/k8s/deployment-slot.yaml > /tmp/deploy-green.yaml

          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} apply -f /tmp/deploy-green.yaml --record=false
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} rollout status deployment/wiki-green --timeout=300s

          NAME="wiki-green"
          REV=$(kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get deployment $NAME -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "revision=$REV" >> $GITHUB_OUTPUT

      - name: Notify — green deployed
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/notify.sh \
            ":rocket: GREEN deployed to ${{ inputs.environment }}" \
            "wiki:${{ inputs.image_tag }}" \
            "${{ github.sha }}" \
            "#ff9900"

  # ── Stage 2: smoke test on GREEN via preview URL ──────────────────────────
  smoke-test:
    name: Smoke tests on GREEN
    needs: deploy-green
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests via in-cluster debug pod (against wiki-preview)
        env:
          NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        run: |
          # GREEN slot доступен через cluster DNS:
          #   wiki-preview.<namespace>.svc.cluster.local
          # Запускаем smoke + E2E ИЗНУТРИ кластера — через временный debug-pod.
          # Это даёт реальный сетевой путь (как у других приложений в кластере),
          # и не требует port-forward на localhost (который недоступен извне runner'а).
          bash scripts/e2e-in-cluster.sh "$NAMESPACE" wiki-preview /tmp/e2e-prepromote

      - name: Upload pre-promote E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-prepromote-report-${{ inputs.environment }}
          path: /tmp/e2e-prepromote/
          retention-days: 14
          if-no-files-found: ignore

  # ── Stage 3: switch traffic (BLUE → GREEN) ────────────────────────────────
  switch-traffic:
    name: Promote GREEN to live
    needs: smoke-test
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch service selector to slot=green
        run: |
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} patch svc wiki \
            -p '{"spec":{"selector":{"app.kubernetes.io/name":"wiki","app.kubernetes.io/slot":"green"}}}'
          sleep 3
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get endpoints wiki -o yaml

      - name: Verify live traffic via explicit URL
        env:
          WIKI_URL: ${{ env.WIKI_URL }}
        run: |
          echo "Checking live URL: $WIKI_URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$WIKI_URL/health/live" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✓ Live traffic verified: 200 OK at $WIKI_URL"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 3s..."
            sleep 3
          done
          echo "::error::Live health check failed after 10 attempts: $WIKI_URL/health/live"
          exit 1

      - name: Run post-promote E2E against live service (in-cluster)
        env:
          NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        run: |
          # После переключения Service wiki указывает на slot=GREEN.
          # Тестируем через cluster DNS: wiki.<namespace>.svc.cluster.local
          # (это внутренний путь приложения в кластере).
          # Параллельно уже запущен Verify live traffic via explicit URL (через bastion).
          echo "─── Post-promote E2E on live service (in-cluster) ───"
          echo "Testing: http://wiki.${NAMESPACE}.svc.cluster.local"
          bash scripts/e2e-in-cluster.sh "$NAMESPACE" wiki /tmp/e2e-postpromote

      - name: Upload post-promote E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-postpromote-report-${{ inputs.environment }}
          path: /tmp/e2e-postpromote/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify — promoted
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/notify.sh \
            ":tada: Promoted to ${{ inputs.environment }}" \
            "wiki:${{ inputs.image_tag }}  URL=${{ env.WIKI_URL }}" \
            "${{ github.sha }}" \
            "#36a64f"

  # ── Stage 4: scale down old BLUE (keep for rollback) ─────────────────────
  scale-down-blue:
    name: Scale down BLUE
    needs: switch-traffic
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Annotate + scale down previous blue revision (keep 1 for rollback)
        run: |
          BLUE=$(kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get deploy -l app.kubernetes.io/slot=blue -o name 2>/dev/null || true)
          if [ -n "$BLUE" ]; then
            kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} annotate --overwrite deploy/wiki-blue \
              wiki.rollwar.io/last-live-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              wiki.rollwar.io/image-tag="${{ inputs.image_tag }}"
            kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} scale deploy/wiki-blue --replicas=1
            echo "BLUE scaled to 1 (kept for rollback)"
          else
            echo "No prior BLUE — fresh deploy"
          fi

      - name: Tag current green as blue (for next cycle)
        run: |
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} annotate --overwrite deploy/wiki-green \
            wiki.rollwar.io/promoted-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ── Stage 5: post-deploy health monitor (auto-rollback on failure) ────────
  post-deploy-monitor:
    name: Post-deploy monitor (auto-rollback on failure)
    needs: [switch-traffic, scale-down-blue]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Monitor live URL for 2 minutes — auto-rollback if degraded
        env:
          WIKI_URL: ${{ env.WIKI_URL }}
          NAMESPACE: ${{ env.KUBE_NAMESPACE }}
          ROLLBACK_WORKFLOW: rollback.yml
        run: bash scripts/post-deploy-monitor.sh

  # ── Final: notify on failure ───────────────────────────────────────────────
  notify-failure:
    name: Notify failure (auto-rollback triggered)
    needs: [deploy-green, smoke-test, switch-traffic, post-deploy-monitor]
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/notify.sh \
            ":rotating_light: CD FAILED — rollback triggered" \
            "wiki:${{ inputs.image_tag }}  URL=${{ env.WIKI_URL }}" \
            "${{ github.sha }}" \
            "#dc3545"
