name: E2E

# Functional end-to-end tests against a deployed environment.
# Запускается на self-hosted runner, где kubectl context=k8s уже настроен.
# Тесты идут через явный URL (bastion → ingressgateway → wiki service).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: choice
        options: [staging, production]
        default: staging
  schedule:
    - cron: '0 4 * * *'   # nightly at 04:00 UTC
  workflow_call:
    inputs:
      environment:
        type: string
        default: staging

permissions:
  contents: read

env:
  KUBE_NAMESPACE: wiki-${{ inputs.environment }}
  # Явный URL (bastion → ingressgateway → wiki service)
  WIKI_URL: ${{ inputs.environment == 'production' && 'http://wiki.k8s-3.sa' || 'http://wiki-stage.k8s-3.sa' }}

jobs:
  e2e:
    name: Functional tests on ${{ inputs.environment }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kubectl + context k8s
        run: |
          kubectl --context k8s version --client
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get deploy -l app.kubernetes.io/name=wiki | head -5

      - name: Verify WIKI_URL is reachable
        env:
          URL: ${{ env.WIKI_URL }}
        run: |
          echo "Testing URL: $URL"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL/health/live" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✓ $URL reachable (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "::error::$URL not reachable after 10 attempts"
          exit 1

      - name: Run functional tests via explicit URL
        env:
          WIKI_URL: ${{ env.WIKI_URL }}
        run: bash tests/e2e/run.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.environment }}
          path: tests/e2e/report/
          retention-days: 14
