name: Rollback

# Manual or auto-triggered rollback.
# Запускается на self-hosted runner с kubectl context=k8s.
# После rollback'а проверка идёт через явный URL.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to roll back'
        type: choice
        options: [staging, production]
        default: production
      reason:
        description: 'Reason for rollback'
        required: true
        default: 'manual rollback'
      to_revision:
        description: 'Specific revision to roll back to (optional)'
        required: false
        default: ''
  repository_dispatch:
    types: [rollback]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

env:
  KUBE_NAMESPACE: wiki-${{ inputs.environment }}
  WIKI_URL: ${{ inputs.environment == 'production' && 'http://wiki.k8s-3.sa' || 'http://wiki-stage.k8s-3.sa' }}

jobs:
  rollback:
    name: Rollback (${{ inputs.environment }})
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify kubectl + context k8s
        run: |
          kubectl --context k8s version --client
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get deploy -l app.kubernetes.io/name=wiki | head -5

      - name: Identify previous deployment (BLUE)
        run: |
          BLUE=$(kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get deploy wiki-blue -o name 2>/dev/null || true)
          if [ -z "$BLUE" ]; then
            echo "::error::No wiki-blue deployment found — nothing to roll back to"
            exit 1
          fi
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} scale deploy/wiki-blue --replicas=3
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} rollout status deployment/wiki-blue --timeout=180s

      - name: Switch traffic back to BLUE
        run: |
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} patch svc wiki \
            -p '{"spec":{"selector":{"app.kubernetes.io/name":"wiki","app.kubernetes.io/slot":"blue"}}}'
          sleep 3
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} get endpoints wiki -o yaml

      - name: Verify rollback via explicit URL
        env:
          WIKI_URL: ${{ env.WIKI_URL }}
        run: |
          echo "Verifying rollback at $WIKI_URL ..."
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$WIKI_URL/health/live" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "✓ Rollback verified: $WIKI_URL/health/live → 200 OK"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 3s..."
            sleep 3
          done
          echo "::error::Rollback verification failed at $WIKI_URL"
          exit 1

      - name: Scale down failed GREEN
        run: |
          kubectl --context k8s -n ${{ env.KUBE_NAMESPACE }} scale deploy/wiki-green --replicas=0 || true
          echo "Failed GREEN scaled to 0"

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          bash scripts/notify.sh \
            ":rewind: ROLLBACK completed on ${{ inputs.environment }}" \
            "Reason: ${{ inputs.reason }}  URL=${{ env.WIKI_URL }}" \
            "${{ github.sha }}" \
            "#ff9900"
