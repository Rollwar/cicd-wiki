name: Performance

# Performance tests against a deployed environment using k6.
# Triggered: nightly, manually, or after a successful production deploy.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        options: [staging, production]
        default: staging
      duration:
        description: 'Test duration (e.g. 30s, 2m)'
        default: '60s'
      vus:
        description: 'Virtual users'
        default: '50'
  schedule:
    - cron: '0 5 * * *'   # nightly at 05:00 UTC
  workflow_run:
    workflows: ['CD']
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  KUBE_NAMESPACE: wiki-production

jobs:
  k6-load:
    name: k6 load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install kubectl + k6
        run: |
          curl -fsSL https://dl.k6.io/x86_64-linux/k6-v0.51.0.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/k6-v0.51.0/k6 /usr/local/bin/
          k6 version

      - name: Resolve target URL
        id: target
        run: |
          ENV="${{ inputs.environment || 'production' }}"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "url=http://wiki.${ENV}.svc.cluster.local:3000" >> $GITHUB_OUTPUT

      - name: Run k6 load test
        env:
          K6_OUT: json=/tmp/k6-results.json
        run: |
          k6 run \
            --env TARGET_URL=${{ steps.target.outputs.url }} \
            --env DURATION=${{ inputs.duration || '60s' }} \
            --env VUS=${{ inputs.vus || '50' }} \
            --summary-export=/tmp/k6-summary.json \
            tests/performance/k6-load.js || EXIT=$?

          # Capture threshold failures but don't fail the workflow — capture result instead
          EXIT=${EXIT:-0}
          echo "exit=$EXIT" >> $GITHUB_ENV
          exit 0

      - name: Parse k6 results
        id: parse
        run: |
          node tests/performance/parse-results.js /tmp/k6-summary.json > /tmp/perf-summary.md
          cat /tmp/perf-summary.md
          # Determine pass/fail based on p95 latency threshold (200ms)
          P95=$(jq -r '.metrics.http_req_duration["p(95)"]' /tmp/k6-summary.json)
          PASS=$(echo "$P95 < 200" | bc -l)
          echo "p95_ms=$P95" >> $GITHUB_OUTPUT
          echo "passed=$PASS" >> $GITHUB_OUTPUT

      - name: Notify Slack — performance
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.parse.outputs.passed }}" == "1" ]; then
            STATUS=":white_check_mark: PASSED"
            COLOR="#36a64f"
          else
            STATUS=":warning: REGRESSION"
            COLOR="#ff9900"
          fi
          bash scripts/notify.sh \
            "$STATUS — performance test on ${{ inputs.environment || 'production' }}" \
            "p95=${{ steps.parse.outputs.p95_ms }}ms" \
            "${{ github.sha }}" \
            "$COLOR"

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ inputs.environment || 'production' }}
          path: |
            /tmp/k6-results.json
            /tmp/k6-summary.json
            /tmp/perf-summary.md
          retention-days: 30
