# Секреты wiki.js.
#
# ВНИМАНИЕ: значения ниже — ДЕМО, для боевого production замените на:
#   1) SealedSecret (Bitnami) или external-secrets-operator
#   2) managed PostgreSQL (CloudSQL / RDS / Aiven) вместо in-cluster StatefulSet
#
# ВАЖНО про имена переменных:
#   requarks/wiki-v2 читает пароль БД из переменной `DB_PASS` (а не DB_PASSWORD).
#   Это отличие от типичных Node.js приложений. См. server/models/db.js в upstream.
#
# Поэтому в Secret два ключа:
#   DB_PASSWORD / PG_PASSWORD — для wiki-app и postgres (стандартное имя)
#   DB_PASS                   — то, что реально читает wiki.js v2
apiVersion: v1
kind: Secret
metadata:
  name: wiki-secret
  labels:
    app.kubernetes.io/name: wiki
type: Opaque
stringData:
  # ── Пароль от БД (читает и wiki.js, и postgres StatefulSet) ─────────────
  # DB_PASS — то, что читает requarks/wiki-v2 (server/models/db.js)
  # DB_PASSWORD — дубликат для других клиентов (CI скрипты и т.д.)
  # PG_PASSWORD — то, что читает postgres:15-alpine (POSTGRES_PASSWORD)
  DB_PASS: wiki
  DB_PASSWORD: wiki
  PG_PASSWORD: wiki

  # ── Session secret для Express-session ──────────────────────────────────
  # В проде заменить на 64+ случайных байта: `openssl rand -hex 32`
  SESSION_SECRET: replace-with-sealed-secret-in-prod-change-me-to-64-bytes

  # ── DATABASE_URL для внешних инструментов (миграции, скрипты) ────────────
  # Короткое имя "postgres" резолвится в текущем namespace.
  # Note: wiki.js v2 САМ собирает URL из DB_TYPE/DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS.
  # DATABASE_URL здесь для совместимости со сторонними скриптами, wiki.js его НЕ использует.
  DATABASE_URL: postgres://wiki:wiki@postgres:5432/wiki
