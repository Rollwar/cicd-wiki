# Embedded PostgreSQL (single-replica, for demo/dev — in prod use a managed DB).
#
# StatefulSet СВОБОДЕН от плейсхолдеров __IMAGE__/__SLOT__ и применяется ОДИН РАЗ
# (как часть первичной bootstrap-установки). Повторное apply из cd.yml его не трогает —
# cd.yml рендерит только deployment-slot.yaml (wiki-blue/green) в /tmp/deploy-green.yaml.
#
# ВАЖНО: postgres живёт в том же namespace, что и wiki-* deployments, поэтому
# короткое имя `postgres` в DATABASE_URL резолвится в `postgres.<ns>.svc.cluster.local`.
#
# ANNOTATION sidecar.istio.io/inject=false — намеренно ОТКЛЮЧАЕТ Istio sidecar
# для postgres. Причины:
#   1. postgres и так тяжёлый контейнер, лишний sidecar его замедляет
#   2. mTLS между wiki-app и postgres не обязателен (внутри namespace)
#   3. Istio CNI может ломать tcp-traffic для БД (особенно prepared statements)
#   4. Это устраняет warning IST0103 "pod is missing the Istio proxy"
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
      annotations:
        # Явно отключаем Istio sidecar injection для postgres
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: wiki
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiki-secret
                  key: PG_PASSWORD
            - name: POSTGRES_DB
              value: wiki
          ports:
            - containerPort: 5432
              name: tcp-pg
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wiki"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "wiki"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-pg
      port: 5432
      targetPort: tcp-pg
